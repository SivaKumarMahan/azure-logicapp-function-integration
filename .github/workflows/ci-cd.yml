name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Azure (needs OIDC secrets and variables)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SqlFunctionDemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SqlFunctionDemo/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  bicep:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      - name: Build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Lint
        run: az bicep lint --file infra/main.bicep

  deploy:
    name: Deploy to Azure
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [test, bicep]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # OIDC federated credential, no client secret
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      BASE_NAME: ${{ vars.BASE_NAME }}
      SQL_SERVER_NAME: ${{ vars.SQL_SERVER_NAME }}
      SQL_DATABASE_NAME: ${{ vars.SQL_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Phase 1: everything except the Logic App (it needs the function to exist).
      - name: Deploy infrastructure (phase 1)
        id: infra
        run: |
          set -euo pipefail
          app_name=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "infra-${GITHUB_RUN_ID}-1" \
            --template-file infra/main.bicep \
            --parameters baseName="$BASE_NAME" sqlServerName="$SQL_SERVER_NAME" \
                         sqlDatabaseName="$SQL_DATABASE_NAME" deployLogicApp=false \
            --query properties.outputs.functionAppName.value -o tsv)
          echo "function_app_name=$app_name" >> "$GITHUB_OUTPUT"

      - name: Deploy function code
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.function_app_name }}
          package: SqlFunctionDemo
          sku: flexconsumption
          remote-build: true

      # Phase 2: same template, now with the Logic App.
      - name: Deploy infrastructure (phase 2, Logic App)
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "infra-${GITHUB_RUN_ID}-2" \
            --template-file infra/main.bicep \
            --parameters baseName="$BASE_NAME" sqlServerName="$SQL_SERVER_NAME" \
                         sqlDatabaseName="$SQL_DATABASE_NAME" deployLogicApp=true \
            --output none
